name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The standard library is the only dependency, so there is nothing to install.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run the agent demo (smoke test)
        run: python demo.py

      - name: Run the mutation-testing demo (smoke test)
        run: python mutation_demo.py
